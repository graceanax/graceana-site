baseURL = 'https://graceana.com/'
languageCode = 'es-es'
title = 'Graceana'
theme = 'PaperMod'
contentDir = "content"

[params]
  math = true  # Activador global de matemáticas
  enableKatex = true

[params.homeInfoParams]
  Title = "¡Hola, soy Ana Pérez! 👋"
  Content = "--"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/ana-p%C3%A9rez-816834110/"

# --- CONFIGURACIÓN DE FORMATO (Aquí estaba el truco) ---
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

  # Esto permite que el signo $ pase sin romperse
  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$'], ['\\[', '\\]']]
      inline = [['$', '$'], ['\\(', '\\)']]

[taxonomies]
  category = "categories"
  tag = "tags"